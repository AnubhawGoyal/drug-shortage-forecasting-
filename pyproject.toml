[project]
name = "shortage"
version = "0.1.0"
description = "Predicting US drug shortages under trade-policy stress (survival + ML + trade-exposure ablation)"
authors = [{ name = "Anubhaw Goyal", email = "goyal.anubhaw@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "requests>=2.32",
    "tenacity>=8.3",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1",
    "lightgbm>=4.4",
    "lifelines>=0.29",
    "scikit-survival>=0.23",
    "shap>=0.46",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "openpyxl>=3.1",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pre-commit>=3.7", "pytest>=8", "jupyterlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortage"]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
